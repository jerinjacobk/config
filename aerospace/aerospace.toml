# Config version for compatibility and deprecations
config-version = 2

after-startup-command = []
start-at-login = true

accordion-padding = 0

default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2"]

on-mode-changed = []

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 0
    inner.vertical   = 0
    outer.left       = 0
    outer.bottom     = 0
    outer.top        = 0
    outer.right      = 0

[mode.main.binding]
    # Cycle through apps within the current workspace
    alt-left  = 'focus left'
    alt-right = 'focus right'

    # Switch workspaces
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'

    # Move focused window to a workspace
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'

    # Jump back to previous workspace
    alt-tab = 'focus-back-and-forth'

    alt-shift-r = 'reload-config'

    alt-f = 'exec-and-forget open -a "Finder"'
    alt-t = 'exec-and-forget open -a "kitty"'
    alt-e = 'exec-and-forget open -a "Microsoft Edge"'
    alt-u = 'exec-and-forget open -a "Cursor"'
    alt-c = 'exec-and-forget open -a "Claude"'
    alt-s = 'exec-and-forget open -a "Slack"'

# ── Workspace 1: main apps ────────────────────────────────────────────────────

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'net.kovidgoyal.kitty'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'com.microsoft.edgemac'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'com.todesktop.230313mzl4w4u92'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'com.anthropic.claudefordesktop'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = 'move-node-to-workspace 1'

# ── Workspace 2: background apps ─────────────────────────────────────────────

[[on-window-detected]]
    if.app-id = 'com.cisco.secureclient.gui'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'com.microsoft.OneDrive'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'com.avecto.defendpoint'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'com.okta.mobile'
    run = 'move-node-to-workspace 2'
